[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "duvar-tenis"
version = "0.1.0"
description = "Yerel tenis duvar antrenmanı analizi ve ESP32 sonuç ekranı"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<5",
  "av>=14,<19",
  "PySide6>=6.8,<7",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
pose = ["mediapipe>=0.10.20,<0.11"]
ai = ["rfdetr==1.11.0", "mediapipe>=0.10.20,<0.11"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
duvar-tenis = "tennis_tracking.app:main"

[tool.setuptools.packages.find]
include = ["tennis_tracking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
